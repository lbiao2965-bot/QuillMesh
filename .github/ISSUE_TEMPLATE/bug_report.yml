name: Bug report
description: Report a reproducible QuillMesh problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve QuillMesh. Remove private document content before attaching files or screenshots.
  - type: input
    id: version
    attributes:
      label: QuillMesh version
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown sample
      description: Paste the smallest non-sensitive example that reproduces the problem.
      render: markdown
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Drag files here after checking that they contain no secrets or personal data.
